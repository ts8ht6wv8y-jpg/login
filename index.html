<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google</title>
    <link href="css/bootstrap.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row bg-white rounded-4 shadow-lg overflow-hidden w-100"
             style="max-width: 1000px;">
            <div class="col-lg-6 bg-info text-white p-5 d-flex flex-column justify-content-center">
                <div class="mb-5">
                    <i class="bi bi-stars fs-1"></i>
                    <h2 class="fw-bold mt-3">Mariam</h2>
                    <p class="text-white-50">Your journey starts here.</p>
                </div>
                <h1 class="fw-bold display-5">
                    Welcome<br>Back!
                </h1>
                <p class="lead mt-3">
                    Sign in to access your account and
                    continue where you left off.
                </p>
                <div class="mt-5 fs-1">
                    <i class="bi bi-person-lock"></i>
                    <i class="bi bi-arrow-right mx-3"></i>
                    <i class="bi bi-person-check"></i>
                </div>
            </div>
            <div class="col-lg-6 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-info-subtle text-primary rounded-circle
                                d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 75px; height: 75px;">
                        <i class="bi bi-person-fill fs-1"></i>
                    </div>
                    <h2 class="fw-bold">Sign In</h2>
                    <p class="text-secondary">
                        Enter your details to log in
                    </p>
                </div>
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            Email Address
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="name@example.com"
                                required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between
                                align-items-center mb-4">
                        <div class="form-check">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="remember">
                            <label class="form-check-label" for="remember">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-primary text-decoration-none">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit"
                            class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">
                        Sign In
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1">
                        <span class="text-secondary px-3">OR</span>
                        <hr class="flex-grow-1">
                    </div>
                    <button type="button"
                            class="btn btn-outline-dark w-100 py-2">
                        <i class="bi bi-google me-2"></i>
                        Continue with facebook
                    </button>
                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="#" class="text-primary fw-bold
                                           text-decoration-none">
                            Create Account
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>
<script src="js/bootstrap.js"></script>
</body>
</html>
